name: Apply Phase 9 V7 Windows sync upgrade

on:
  push:
    branches: [phase9-mobile-parity]
    paths:
      - "sync/apply_phase9_v7_windows.py"
      - ".github/workflows/apply-phase9-v7-windows.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-mobile-parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Windows V7 sync changes
        run: python sync/apply_phase9_v7_windows.py
      - name: Compile Python changes
        run: python -m compileall -q windows sync
      - name: Commit Windows V7 sync changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/mobile_sync_frontend_adapter.py windows/mobile_sync_server.py windows/mobile_sync_v7.py sync/build_phase9_desktop_delta.py
          if git diff --cached --quiet; then
            echo "Windows V7 sync changes already applied"
          else
            git commit -m "Apply Phase 9 V7 authoritative sync commands"
            git push origin phase9-mobile-parity
          fi

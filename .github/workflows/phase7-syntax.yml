name: Phase 7 syntax

on:
  push:
    branches:
      - phase7-role-split-party-dashboard

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile sync/phase7/*.py
      - name: JavaScript syntax
        run: node --check sync/phase7/party_dashboard/app.js

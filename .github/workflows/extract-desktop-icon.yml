name: Extract desktop DID icon

on:
  push:
    branches: [phase9-mobile-parity]
    paths:
      - "sync/extract_desktop_app_icon.py"
      - ".github/workflows/extract-desktop-icon.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-mobile-parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon extractor dependencies
        run: python -m pip install --disable-pip-version-check pefile pillow
      - name: Download current Windows DID installer
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/did-setup.exe \
            https://github.com/almogbell/DID-Character-Sheet/releases/download/v1.0.10/DID_Character_Sheet_Setup_1.0.10.exe
      - name: Extract exact desktop app icon
        run: |
          python sync/extract_desktop_app_icon.py \
            /tmp/did-setup.exe \
            android/app/src/main/res/drawable-nodpi/did_desktop_icon.png
      - name: Point Android launcher at desktop icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('@drawable/did_app_icon', '@drawable/did_desktop_icon')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit real launcher icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/AndroidManifest.xml android/app/src/main/res/drawable-nodpi/did_desktop_icon.png
          git commit -m "Use exact desktop DID app icon on Android" || exit 0
          git push origin phase9-mobile-parity

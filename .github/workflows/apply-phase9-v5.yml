name: Apply Phase 9 V5 patch

on:
  push:
    branches: [phase9-mobile-parity]
    paths:
      - "sync/apply_phase9_v5_patch.py"
      - ".github/workflows/apply-phase9-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-mobile-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply V5 feedback patch
        run: python sync/apply_phase9_v5_patch.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android sync/validate_phase9_mobile.py
          git commit -m "Apply Phase 9 V5 real-device feedback"
          git push origin HEAD:phase9-mobile-parity

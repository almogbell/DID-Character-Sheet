name: Phase 8 syntax

on:
  push:
    branches:
      - phase8-dm-campaign-layer

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile sync/phase8/*.py
      - name: JavaScript syntax
        run: node --check sync/phase8/campaign_layer.js
      - name: Phase 8 static integration test
        run: python sync/phase8/test_phase8.py

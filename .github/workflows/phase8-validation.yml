name: Phase 8 validation

on:
  push:
    branches: [main, phase8-sync]
    paths:
      - "updates/**"
      - "sync/**"
      - "windows/mobile_sync_server.py"
      - "windows/mobile_sync_frontend_adapter.py"
      - "windows/mobile_companion_controller.py"
      - "windows/mobile_companion_dialog.py"
      - "windows/test_mobile_sync_server.py"
      - "windows/test_mobile_sync_frontend_adapter.py"
      - "windows/test_mobile_companion_controller.py"
      - "android/phase8/**"
      - ".github/workflows/phase8-validation.yml"
  pull_request:
    paths:
      - "updates/**"
      - "sync/**"
      - "windows/mobile_sync_server.py"
      - "windows/mobile_sync_frontend_adapter.py"
      - "windows/mobile_companion_controller.py"
      - "windows/mobile_companion_dialog.py"
      - "windows/test_mobile_sync_server.py"
      - "windows/test_mobile_sync_frontend_adapter.py"
      - "windows/test_mobile_companion_controller.py"
      - "android/phase8/**"
      - ".github/workflows/phase8-validation.yml"

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate update manifests and Android protocol constants
        run: python sync/validate_manifests.py
      - name: Validate cross-platform sync protocol contract
        run: python sync/validate_protocol_contract.py
      - name: Validate Phase 8 Android source invariants
        run: python sync/validate_android_phase8_sources.py

  sync-server-tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync test dependency
        run: python -m pip install PySide6
      - name: Run Phase 8 Windows sync tests
        run: >-
          python -m unittest
          windows.test_mobile_sync_server
          windows.test_mobile_sync_frontend_adapter
          windows.test_mobile_companion_controller
          -v

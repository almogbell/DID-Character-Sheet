name: DID validation

on:
  push:
    branches: [main, phase8-sync, phase9-mobile-parity]
    paths:
      - "updates/**"
      - "sync/**"
      - "windows/**"
      - "android/**"
      - ".github/workflows/phase8-validation.yml"
  pull_request:
    paths:
      - "updates/**"
      - "sync/**"
      - "windows/**"
      - "android/**"
      - ".github/workflows/phase8-validation.yml"

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile DID sync Python sources
        run: python -m compileall -q sync windows
      - name: Validate update manifests and Android protocol constants
        run: python sync/validate_manifests.py
      - name: Validate cross-platform sync protocol contract
        run: python sync/validate_protocol_contract.py
      - name: Validate Android companion source invariants
        run: python sync/validate_android_phase8_sources.py
      - name: Validate Phase 9 mobile parity invariants
        run: python sync/validate_phase9_mobile.py
      - name: Build Windows Phase 8 integration bundle
        run: python sync/build_windows_phase8_bundle.py
      - name: Upload Windows Phase 8 integration bundle
        uses: actions/upload-artifact@v4
        with:
          name: did-phase8-windows-integration
          path: dist/DID_Phase8_Windows_Integration.zip
          if-no-files-found: error
      - name: Build Phase 9 Windows delta
        run: python sync/build_phase9_desktop_delta.py
      - name: Upload Phase 9 Windows delta
        uses: actions/upload-artifact@v4
        with:
          name: did-phase9-windows-delta
          path: dist/DID_Phase9_Desktop_Delta.zip
          if-no-files-found: error

  sync-server-tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync test dependency
        run: python -m pip install PySide6
      - name: Run Windows sync and integration tests
        run: >-
          python -m unittest
          windows.test_mobile_sync_server
          windows.test_mobile_sync_frontend_adapter
          windows.test_mobile_companion_controller
          windows.test_integrate_mobile_companion
          -v

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable DID debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: did-android-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: did-android-phase9-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

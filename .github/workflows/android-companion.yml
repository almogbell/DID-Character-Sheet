name: Android companion build

on:
  push:
    branches: [phase8-sync, main]
    paths:
      - "android/**"
      - "updates/android.json"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android/**"
      - "updates/android.json"
      - ".github/workflows/android-companion.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android/companion-app :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: did-android-phase8-debug
          path: android/companion-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Publish DID Android

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate release metadata
        id: meta
        shell: bash
        run: |
          python sync/validate_manifests.py
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#android-v}"
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("updates/android.json", encoding="utf-8"))["version"])')"
          MIN_WINDOWS="$(python -c 'import json; print(json.load(open("updates/android.json", encoding="utf-8"))["minimum_desktop_version"])')"
          WINDOWS_VERSION="$(python -c 'import json; print(json.load(open("updates/windows.json", encoding="utf-8"))["version"])')"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG does not match updates/android.json version $MANIFEST_VERSION" >&2
            exit 1
          fi
          python - "$MIN_WINDOWS" "$WINDOWS_VERSION" <<'PY'
          import sys
          def key(v): return tuple(int(x) for x in v.split('-')[0].split('+')[0].split('.'))
          if key(sys.argv[1]) > key(sys.argv[2]):
              raise SystemExit(
                  f"Android requires Windows {sys.argv[1]}, but updates/windows.json only advertises {sys.argv[2]}"
              )
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Android project and signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f android/gradlew || { echo "android/gradlew is missing; merge the full Android Studio project before publishing." >&2; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing." >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing." >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing." >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing." >&2; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts

      - name: Restore Android signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/did-release.keystore"
          chmod 600 "$RUNNER_TEMP/did-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          DID_RELEASE_STORE_FILE: ${{ runner.temp }}/did-release.keystore
          DID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Locate signed APK
        id: apk
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SOURCE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          test -n "$SOURCE" || { echo "No signed release APK was produced." >&2; exit 1; }
          TARGET="$RUNNER_TEMP/DID_Character_Sheet_Android_${VERSION}.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.load(open('updates/android.json', encoding='utf-8'))
          notes = data.get('release_notes') or f"DID Android {data['version']}"
          path = pathlib.Path('/tmp/did_android_release_notes.md')
          path.write_text(notes + '\n', encoding='utf-8')
          PY
          echo "path=/tmp/did_android_release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.apk.outputs.path }}" \
            --title "DID Android ${{ steps.meta.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --verify-tag

      - name: Update Android update manifest on main
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git fetch origin main
          git checkout main
          python sync/finalize_android_release.py --version "$VERSION"
          python sync/validate_manifests.py
          if git diff --quiet -- updates/android.json; then
            echo "Android manifest already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android.json
          git commit -m "Publish Android $VERSION update manifest"
          git push origin main

<!doctype html><html><head><meta charset="utf-8"><title>DID test pack checklist</title><style>body{font:17px system-ui;max-width:740px;margin:40px auto;padding:0 20px;background:#f8f3e9;color:#291d13}h1{font-size:25px}label{display:block;margin:10px 0;padding:13px;background:#fff;border:1px solid #bb9b64;border-radius:9px;cursor:pointer}input{width:20px;height:20px;vertical-align:middle;accent-color:#498368}</style></head><body><h1>Check the expanded test pack</h1><label><input type="checkbox" data-id="0"> Run the quick suites with python run_all_did_tests.py.</label>
<label><input type="checkbox" data-id="1"> Run the preserved core, safety, improvements, and redesign suites with python run_all_did_tests.py --full.</label>
<label><input type="checkbox" data-id="2"> The report is written under the test folder, with no app source changes.</label>
<label><input type="checkbox" data-id="3"> The portrait tests use the pre-conversion behavior: JPEG stays JPEG.</label><script>document.querySelectorAll('input').forEach(x=>{x.checked=localStorage.getItem('did-testpack-full-'+x.dataset.id)==='true';x.onchange=()=>localStorage.setItem('did-testpack-full-'+x.dataset.id,x.checked)})</script></body></html>
